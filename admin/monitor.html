<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Monitor - EventSync</title>
<link rel="stylesheet" href="/css/app.css">
</head><body>
<main class="container"><div class="pagehead"><div><h1>Live Attendance Monitor</h1><p class="muted sm">Updates instantly from every device.</p></div><select id="ev"></select></div><div class="stats"><div class="card stat"><b id="sReg">0</b><span>Registered</span></div><div class="card stat"><b id="sAtt">0</b><span>Checked in</span></div><div class="card stat"><b id="sLeft">0</b><span>Remaining</span></div><div class="card stat"><b id="sPct">0%</b><span>Attendance rate</span></div></div><div class="card" style="margin-top:1rem"><div class="bar"><i id="barfill" style="width:0"></i></div></div><div class="card" style="margin-top:1rem"><h2>Check-in feed</h2><ul class="feed" id="feed"></ul></div></main>
<script type="module" src="/js/admin/monitor.js"></script>
</body></html>
