<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/css/theme.css">
</head><body>
<main class="container"><div class="pagehead"><div><h1>Live Attendance Monitor</h1><p class="muted sm">Updates instantly from every device.</p></div><div class="row"><span id="testChip" class="badge dup" hidden>TEST MODE</span><label class="check" style="margin:0;white-space:nowrap"><input type="checkbox" id="incTest"> Include test</label><select id="ev"></select></div></div><div class="stats">
  <div class="card stat"><div class="stat-top"><span>Registered</span><span class="stat-icon" id="iReg"></span></div><b id="sReg">0</b></div>
  <div class="card stat"><div class="stat-top"><span>Checked in</span><span class="stat-icon" id="iAtt"></span></div><b id="sAtt">0</b></div>
  <div class="card stat"><div class="stat-top"><span>Remaining</span><span class="stat-icon" id="iLeft"></span></div><b id="sLeft">0</b></div>
  <div class="card stat"><div class="stat-top"><span>Attendance rate</span><span class="stat-icon" id="iPct"></span></div><b id="sPct">0%</b></div>
</div><div class="card" style="margin-top:1rem"><div class="bar"><i id="barfill" style="width:0"></i></div></div><div class="card" style="margin-top:1rem"><h2>Check-in feed</h2><ul class="feed" id="feed"></ul></div></main>
<script type="module" src="/js/admin/monitor.js"></script>
</body></html>
