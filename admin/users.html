<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/css/theme.css">
</head><body>
<main class="container">
  <div class="pagehead">
    <div><h1>Users</h1><p class="muted sm">Overview of all participant accounts.</p></div>
    <div class="row">
      <button class="btn ghost" id="exportXlsx">Export Excel (.xlsx)</button>
    </div>
  </div>

  <div class="stats">
    <div class="card stat"><b id="sPart">0</b><span>Participants &amp; Organizers</span></div>
    <div class="card stat"><b id="sActive">0</b><span>Active accounts</span></div>
    <div class="card stat"><b id="sWeek">0</b><span>New this week</span></div>
    <div class="card stat"><b id="sInactive">0</b><span>Inactive accounts</span></div>
  </div>

  <div class="card" id="roleReqCard" style="margin:1rem 0" hidden>
    <div class="pagehead" style="margin-bottom:.5rem">
      <div><h2 style="margin:0">Organizer Role Requests <span class="badge dup" id="reqCountBadge">0</span></h2><p class="muted sm" style="margin:.15rem 0 0">Approve or reject requests from participants who want to organize events.</p></div>
    </div>
    <ul class="feed" id="roleReqList"></ul>
  </div>

  <div class="row toolbar" style="margin:1rem 0">
    <input id="q" placeholder="Search name, email or school ID" style="flex:1;min-width:220px">
    <select id="fStatus" aria-label="Filter by status">
      <option value="">All statuses</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
    <select id="fSchool" aria-label="Filter by school">
      <option value="">All schools</option>
    </select>
    <select id="fProgram" aria-label="Filter by program">
      <option value="">All programs</option>
    </select>
  </div>

  <div id="list"></div>
  <div class="row" id="pager" style="justify-content:center;margin-top:1rem" hidden>
    <span class="muted sm" id="pageInfo"></span>
    <button class="btn ghost sm" id="loadMore">Load more</button>
  </div>

  <dialog id="detailDlg" style="width:min(620px,96vw);max-height:92vh;overflow:auto">
    <div id="detailBody"></div>
  </dialog>
</main>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script type="module" src="/js/admin/users.js"></script>
</body></html>
