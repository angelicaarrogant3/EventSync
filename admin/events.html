<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/css/theme.css">
</head><body>
<main class="container"><div class="pagehead"><div><h1>Events</h1><p class="muted sm">Create, edit, publish and delete events.</p></div><button class="btn" id="newBtn">+ New event</button></div><div id="list"></div><dialog id="dlg"><form id="form"><h2 id="dlgTitle">Event</h2><label>Event banner (optional)</label><div class="evt-drop" id="imgDrop"><input id="imgFile" type="file" accept="image/jpeg,image/png,image/webp" hidden><div class="evt-crop-box" id="imgBox"><img id="imgPrev" alt="Event image preview"></div><div class="evt-crop-controls" id="imgCropCtrl"><div><label for="imgZoom">Zoom</label><input id="imgZoom" type="range" min="1" max="3" step="0.05" value="1"></div><div><label for="imgPanX">Horizontal</label><input id="imgPanX" type="range" min="0" max="1" step="0.02" value="0.5"></div><div><label for="imgPanY">Vertical</label><input id="imgPanY" type="range" min="0" max="1" step="0.02" value="0.5"></div></div><div class="evt-file-meta"><span id="imgMeta">Drag &amp; drop or tap Choose to add a banner</span><div class="row"><button type="button" class="btn sm ghost" id="imgChoose">Choose</button><button type="button" class="btn sm danger" id="imgRemove" hidden>Remove</button></div></div><div class="evt-up-prog" id="imgProg"><i id="imgBar"></i></div><p class="muted sm" style="margin:.25rem 0 0">Recommended 1600 x 900 (16:9). JPEG, PNG, or WebP, up to 5 MB.</p><p class="evt-up-err" id="imgErr" role="alert"></p></div><label>Title</label><input id="title" required minlength="3"><label>Venue</label><input id="venue" required><label>Description</label><textarea id="desc" rows="3"></textarea><div class="two"><div><label>Starts (Asia/Manila)</label><input id="starts" type="datetime-local" required></div><div><label>Ends (Asia/Manila)</label><input id="ends" type="datetime-local" required></div><div><label>Registration opens (optional)</label><input id="regOpens" type="datetime-local"></div><div><label>Registration deadline (optional)</label><input id="deadline" type="datetime-local"></div><div><label>Early check-in grace (min)</label><input id="earlyGrace" type="number" min="0" max="1440" value="60"></div><div><label>Late check-in grace (min)</label><input id="lateGrace" type="number" min="0" max="1440" value="60"></div><div><label>Capacity (blank = unlimited)</label><input id="cap" type="number" min="1"></div><div><label>Status</label><select id="status"><option value="draft">Draft</option><option value="published">Published</option><option value="closed">Closed</option><option value="cancelled">Cancelled</option></select></div></div><p class="muted sm" id="attWindowHint" style="margin:.6rem 0 0"></p><p class="ferr" id="schedWarn" style="margin:.25rem 0 0"></p><label class="check" style="margin-top:.75rem"><input type="checkbox" id="testMode"> <span>Allow attendance outside the schedule (test mode)</span></label><div class="row" style="justify-content:flex-end;margin-top:1rem"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">Save</button></div></form></dialog><dialog id="attDlg" style="width:min(640px,96vw);max-height:90vh;overflow:auto"><div id="attBody"></div></dialog></main>
<script type="module" src="/js/admin/events.js"></script>
</body></html>
