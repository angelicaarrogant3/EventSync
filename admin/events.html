<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Events - EventSync</title>
<link rel="stylesheet" href="/css/app.css">
</head><body>
<main class="container"><div class="pagehead"><div><h1>Events</h1><p class="muted sm">Create, edit, publish and delete events.</p></div><button class="btn" id="newBtn">+ New event</button></div><div id="list"></div><dialog id="dlg"><form id="form"><h2 id="dlgTitle">Event</h2><label>Title</label><input id="title" required minlength="3"><label>Venue</label><input id="venue" required><label>Description</label><textarea id="desc" rows="3"></textarea><div class="two"><div><label>Starts</label><input id="starts" type="datetime-local" required></div><div><label>Ends</label><input id="ends" type="datetime-local" required></div><div><label>Capacity (blank = unlimited)</label><input id="cap" type="number" min="1"></div><div><label>Status</label><select id="status"><option value="draft">Draft</option><option value="published">Published</option><option value="closed">Closed</option></select></div></div><div class="row" style="justify-content:flex-end;margin-top:1rem"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">Save</button></div></form></dialog></main>
<script type="module" src="/js/admin/events.js"></script>
</body></html>
