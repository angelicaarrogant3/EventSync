<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up - EventSync</title>
<link rel="stylesheet" href="/css/app.css">
</head><body>
<div class="authwrap" style="align-items:flex-start"><div class="card" style="margin:1rem 0">
  <h1>Create account</h1><p class="muted sm">Participant accounts only. Admin access is granted by the system owner.</p>
  <form id="f" novalidate>
    <div id="fields"></div>
    <div id="msg"></div>
    <button class="btn" style="width:100%;margin-top:1rem" id="go">Sign up</button>
  </form>
  <p class="sm muted" style="text-align:center">Already registered? <a href="/login">Log in</a></p>
</div></div>
<dialog id="doneDlg" style="text-align:center">
  <div style="font-size:2.5rem">🎉</div>
  <h2>Account created!</h2>
  <p class="muted" id="doneText">Your account is ready. Please log in to continue.</p>
  <a class="btn" id="toLogin" href="/login" style="width:100%">Go to login</a>
</dialog>
<script type="module" src="/js/pages/signup.js"></script>
</body></html>
