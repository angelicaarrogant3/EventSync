<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up - EventSync</title>
<link rel="stylesheet" href="/css/app.css">
</head><body>
<div class="authwrap"><div class="card">
  <h1>Create account</h1><p class="muted sm">Participant accounts only. Admin access is granted by the system owner.</p>
  <form id="f">
    <label for="name">Full name</label><input id="name" required minlength="2" autocomplete="name">
    <label for="email">Email</label><input id="email" type="email" required autocomplete="email">
    <label for="password">Password (min 6 characters)</label><input id="password" type="password" required minlength="6" autocomplete="new-password">
    <div id="msg"></div>
    <button class="btn" style="width:100%;margin-top:1rem" id="go">Sign up</button>
  </form>
  <p class="sm muted" style="text-align:center">Already registered? <a href="/login">Log in</a></p>
</div></div>
<script type="module" src="/js/pages/signup.js"></script>
</body></html>
