<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EventSync</title>
  <style>
    :root { --primary: #2563eb; --primary-dark: #1d4ed8; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #cbd5e1; --danger: #dc2626; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .auth-card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid #e2e8f0; border-radius: 14px; padding: 2rem; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08); }
    .brand { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
    .logo { width: 42px; height: 42px; border-radius: 10px; background: var(--primary); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 1.1rem; }
    h1 { font-size: 1.35rem; margin: 0; }
    .subtitle { font-size: 0.88rem; color: var(--muted); margin: 0.15rem 0 0; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; }
    input { width: 100%; padding: 0.65rem 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; }
    input:focus { outline: 2px solid #93c5fd; border-color: var(--primary); }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 4rem; }
    .pw-toggle { position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--primary); font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 0.25rem 0.4rem; }
    .btn { width: 100%; padding: 0.75rem; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
    .btn:hover { background: var(--primary-dark); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert { display: none; padding: 0.7rem 0.85rem; border-radius: 8px; font-size: 0.86rem; margin-bottom: 1rem; background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .alert.visible { display: block; }
    .links { margin-top: 1.25rem; display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); flex-wrap: wrap; gap: 0.5rem; }
    .links a { color: var(--primary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <div class="logo">ES</div>
      <div>
        <h1>Sign in to EventSync</h1>
        <p class="subtitle">Participants &amp; Administrators</p>
      </div>
    </div>

    <div id="errorBox" class="alert" role="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="usernameOrEmail">Username or Email</label>
        <input id="usernameOrEmail" name="usernameOrEmail" type="text" autocomplete="username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="togglePw" aria-label="Show password">Show</button>
        </div>
      </div>

      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>

    <div class="links">
      <span>New participant? <a href="/signup">Create account</a></span>
      <a href="/connect">Network Hub</a>
    </div>
  </div>

  <script>
    const pwInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePw');
    toggleBtn.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      toggleBtn.textContent = show ? 'Hide' : 'Show';
    });

    const params = new URLSearchParams(window.location.search);
    const nextUrl = params.get('next');

    function isSafeRelative(u) {
      return typeof u === 'string' && u.startsWith('/') && !u.startsWith('//');
    }

    // If already logged in, redirect to dashboard
    fetch('/api/auth/me').then(r => r.ok ? r.json() : null).then(json => {
      if (json && json.ok && json.data?.user) {
        const role = json.data.user.role;
        const defaultDest = role === 'administrator' ? '/admin' : '/app';
        window.location.replace(isSafeRelative(nextUrl) ? nextUrl : defaultDest);
      }
    }).catch(() => {});

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('errorBox');
      const btn = document.getElementById('submitBtn');
      errBox.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            usernameOrEmail: document.getElementById('usernameOrEmail').value.trim(),
            password: pwInput.value
          })
        });
        const json = await res.json();
        if (!res.ok || !json.ok) {
          errBox.textContent = json.error?.message || 'Login failed. Please check your credentials.';
          errBox.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }

        const dest = isSafeRelative(nextUrl) ? nextUrl : json.data.redirectTo;
        window.location.href = dest;
      } catch (err) {
        errBox.textContent = 'Network error. Please check your connection to the EventSync server.';
        errBox.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
