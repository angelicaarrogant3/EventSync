<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Portal - EventSync</title>
  <style>
    :root { --primary: #2563eb; --primary-dark: #1d4ed8; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { background: #0f172a; color: #fff; padding: 0.85rem 1.25rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; }
    .brand { display: flex; align-items: center; gap: 0.65rem; font-weight: 700; }
    .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--primary); display: grid; place-items: center; font-weight: 800; }
    nav { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    nav a { color: #cbd5e1; text-decoration: none; padding: 0.4rem 0.7rem; border-radius: 6px; font-size: 0.86rem; font-weight: 500; }
    nav a.active, nav a:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .user-bar { display: flex; align-items: center; gap: 0.65rem; font-size: 0.85rem; }
    .btn { padding: 0.5rem 0.85rem; border-radius: 8px; border: 1px solid transparent; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.35rem; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #fff; color: var(--text); border-color: #cbd5e1; }
    .btn-danger { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
    .btn-sm { padding: 0.32rem 0.6rem; font-size: 0.78rem; }
    main { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 1.25rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04); margin-bottom: 1rem; }
    .stat-num { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
    .badge { display: inline-block; padding: 0.18rem 0.55rem; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
    .badge-ok { background: #dcfce7; color: #166534; }
    .badge-warn { background: #fef3c7; color: #92400e; }
    .badge-err { background: #fee2e2; color: #991b1b; }
    .badge-info { background: #e0f2fe; color: #075985; }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th, td { text-align: left; padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--border); }
    th { background: #f8fafc; font-weight: 700; color: var(--muted); font-size: 0.76rem; text-transform: uppercase; }
    input, select { padding: 0.5rem 0.7rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.88rem; background: #fff; }
    .toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
    .alert { padding: 0.7rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.88rem; }
    .alert-ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert-err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    @media print { header, .no-print { display: none !important; } body { background: #fff; } .card { border: none; box-shadow: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">ES</div>
      <span>EventSync Admin</span>
    </div>
    <nav id="navLinks">
      <a href="/admin" data-route="/admin">Dashboard</a>
      <a href="/organizer" target="_blank">Organizer Station</a>
      <a href="/registration" target="_blank">Registration Station</a>
      <a href="/scanner" target="_blank">Scanner Station</a>
      <a href="/admin/participants" data-route="/admin/participants">Participants</a>
      <a href="/admin/accounts" data-route="/admin/accounts">Accounts</a>
      <a href="/admin/records" data-route="/admin/records">Records</a>
      <a href="/admin/reports" data-route="/admin/reports">Reports</a>
      <a href="/admin/activity" data-route="/admin/activity">Activity</a>
    </nav>
    <div class="user-bar">
      <span id="userLabel">Admin</span>
      <button class="btn btn-secondary btn-sm" id="btnLogout">Logout</button>
    </div>
  </header>

  <main>
    <div id="flashBox" style="display:none;"></div>
    <div id="adminContent">Loading...</div>
  </main>

  <script>
    let currentUser = null;

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function flash(msg, type = 'ok') {
      const box = document.getElementById('flashBox');
      box.className = `alert ${type === 'err' ? 'alert-err' : 'alert-ok'}`;
      box.textContent = msg;
      box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 4500);
    }

    async function api(url, opts = {}) {
      const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts
      });
      if (res.status === 401) {
        window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
        throw new Error('Unauthorized');
      }
      if (res.status === 403) {
        window.location.href = '/app';
        throw new Error('Forbidden');
      }
      const json = await res.json();
      if (!res.ok || !json.ok) {
        throw new Error(json.error?.message || 'Request failed');
      }
      return json.data;
    }

    function highlightNav(path) {
      document.querySelectorAll('#navLinks a[data-route]').forEach(a => {
        a.classList.toggle('active', a.dataset.route === path);
      });
    }

    async function renderDashboard() {
      const [summary, activity] = await Promise.all([
        api('/api/reports/summary'),
        api('/api/admin/activity?limit=10')
      ]);
      const t = summary.totals;

      document.getElementById('adminContent').innerHTML = `
        <h1>Administrator Dashboard</h1>
        <div class="grid">
          <div class="card"><div class="stat-num">${t.totalEvents}</div><div class="stat-label">Active Events</div></div>
          <div class="card"><div class="stat-num">${t.totalRegistered}</div><div class="stat-label">Total Registrations</div></div>
          <div class="card"><div class="stat-num">${t.totalPresent}</div><div class="stat-label">Total Checked In</div></div>
          <div class="card"><div class="stat-num">${t.overallAttendanceRate}%</div><div class="stat-label">Overall Attendance Rate</div></div>
        </div>

        <div class="card">
          <h2 style="margin-top:0; font-size:1.05rem;">Station Shortcuts</h2>
          <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
            <a href="/registration" class="btn btn-primary">Open Registration Station</a>
            <a href="/scanner" class="btn btn-primary">Open QR Scanner Station</a>
            <a href="/organizer" class="btn btn-primary">Open Organizer Console</a>
            <a href="/connect" class="btn btn-secondary">Device Connect Hub</a>
          </div>
        </div>

        <div class="card" style="overflow-x:auto;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
            <h2 style="margin:0; font-size:1.05rem;">Recent Activity</h2>
            <a href="/admin/activity" class="btn btn-secondary btn-sm">View All</a>
          </div>
          <table>
            <thead><tr><th>Time</th><th>Action</th><th>User</th><th>Description</th></tr></thead>
            <tbody>
              ${activity.map(a => `
                <tr>
                  <td>${esc(a.created_at)}</td>
                  <td><span class="badge badge-info">${esc(a.action)}</span></td>
                  <td>${esc(a.username || 'System')}</td>
                  <td>${esc(a.description)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    async function renderParticipants() {
      document.getElementById('adminContent').innerHTML = `
        <h1>Participants Directory</h1>
        <div class="toolbar">
          <input id="pSearch" placeholder="Search name, school ID, email, department..." style="flex:1; min-width:220px;">
          <button class="btn btn-primary" id="btnSearchP">Search</button>
        </div>
        <div class="card" style="overflow-x:auto;"><div id="pTable">Loading...</div></div>
      `;

      const load = async () => {
        const q = document.getElementById('pSearch').value.trim();
        const rows = await api('/api/admin/participants' + (q ? '?search=' + encodeURIComponent(q) : ''));
        document.getElementById('pTable').innerHTML = `
          <table>
            <thead><tr><th>School ID</th><th>Full Name</th><th>Email</th><th>Dept / Course</th><th>Year</th><th>Account</th><th>Regs / Attended</th></tr></thead>
            <tbody>
              ${rows.length === 0 ? '<tr><td colspan="7">No participants found.</td></tr>' : rows.map(r => `
                <tr>
                  <td><code>${esc(r.school_id)}</code></td>
                  <td><strong>${esc(r.full_name)}</strong></td>
                  <td>${esc(r.email)}</td>
                  <td>${esc(r.department_or_course)}</td>
                  <td>${esc(r.year_level)}</td>
                  <td>${r.username ? `<span class="badge badge-ok">${esc(r.username)} (${esc(r.account_status)})</span>` : '<span class="badge badge-warn">No Account</span>'}</td>
                  <td>${r.registration_count} / ${r.attendance_count}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      };

      document.getElementById('btnSearchP').addEventListener('click', load);
      await load();
    }

    async function renderAccounts() {
      const users = await api('/api/admin/users');
      document.getElementById('adminContent').innerHTML = `
        <h1>Account Management</h1>
        <div class="card">
          <h2 style="margin-top:0; font-size:1.05rem;">Create Administrator Account</h2>
          <form id="createAdminForm" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:0.65rem; align-items:end;">
            <div><label style="display:block;font-size:0.78rem;font-weight:600;">Full Name</label><input id="aName" required style="width:100%;"></div>
            <div><label style="display:block;font-size:0.78rem;font-weight:600;">Username</label><input id="aUser" required style="width:100%;"></div>
            <div><label style="display:block;font-size:0.78rem;font-weight:600;">Email</label><input id="aEmail" type="email" required style="width:100%;"></div>
            <div><label style="display:block;font-size:0.78rem;font-weight:600;">Password (min 8)</label><input id="aPass" type="password" minlength="8" required style="width:100%;"></div>
            <button type="submit" class="btn btn-primary">Create Admin</button>
          </form>
        </div>

        <div class="card" style="overflow-x:auto;">
          <h2 style="margin-top:0; font-size:1.05rem;">All Application Accounts</h2>
          <table>
            <thead><tr><th>Username</th><th>Full Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              ${users.map(u => `
                <tr>
                  <td><strong>${esc(u.username)}</strong></td>
                  <td>${esc(u.full_name)}</td>
                  <td>${esc(u.email)}</td>
                  <td><span class="badge ${u.role === 'administrator' ? 'badge-info' : 'badge-warn'}">${esc(u.role)}</span></td>
                  <td><span class="badge ${u.account_status === 'active' ? 'badge-ok' : 'badge-err'}">${esc(u.account_status)}</span></td>
                  <td style="display:flex; gap:0.4rem; flex-wrap:wrap;">
                    ${u.id !== currentUser.id ? `
                      <button class="btn btn-secondary btn-sm" onclick="toggleStatus('${u.id}', '${u.account_status === 'active' ? 'inactive' : 'active'}')">
                        ${u.account_status === 'active' ? 'Deactivate' : 'Reactivate'}
                      </button>
                    ` : ''}
                    <button class="btn btn-secondary btn-sm" onclick="resetPw('${u.id}', '${esc(u.username)}')">Reset Password</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      document.getElementById('createAdminForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await api('/api/admin/users/admin', {
            method: 'POST',
            body: JSON.stringify({
              full_name: document.getElementById('aName').value.trim(),
              username: document.getElementById('aUser').value.trim(),
              email: document.getElementById('aEmail').value.trim(),
              password: document.getElementById('aPass').value
            })
          });
          flash('Administrator account created.');
          renderAccounts();
        } catch (err) {
          flash(err.message, 'err');
        }
      });
    }

    window.toggleStatus = async function(id, nextStatus) {
      try {
        await api('/api/admin/users/' + id + '/status', {
          method: 'PATCH',
          body: JSON.stringify({ account_status: nextStatus })
        });
        flash('Account status updated to ' + nextStatus);
        renderAccounts();
      } catch (err) {
        flash(err.message, 'err');
      }
    };

    window.resetPw = async function(id, username) {
      const tempPassword = prompt(`Enter a temporary password (min 8 chars) for ${username}:`);
      if (!tempPassword) return;
      try {
        await api('/api/admin/users/' + id + '/reset-password', {
          method: 'POST',
          body: JSON.stringify({ tempPassword })
        });
        flash(`Temporary password set for ${username}. They will be prompted to change it.`);
      } catch (err) {
        flash(err.message, 'err');
      }
    };

    async function renderRecords() {
      const events = await api('/api/events?includeArchived=true');
      document.getElementById('adminContent').innerHTML = `
        <h1>Registration &amp; Attendance Records</h1>
        <div class="toolbar">
          <select id="rEvent">
            <option value="">All Events</option>
            ${events.map(e => `<option value="${e.id}">${esc(e.title)} (${esc(e.event_date)})</option>`).join('')}
          </select>
          <input id="rSearch" placeholder="Search participant or school ID..." style="flex:1; min-width:200px;">
          <button class="btn btn-primary" id="btnFilterRec">Filter</button>
        </div>
        <div class="card" style="overflow-x:auto;"><div id="recTable">Loading...</div></div>
      `;

      const load = async () => {
        const params = new URLSearchParams();
        const evId = document.getElementById('rEvent').value;
        const s = document.getElementById('rSearch').value.trim();
        if (evId) params.set('eventId', evId);
        if (s) params.set('search', s);
        const rows = await api('/api/admin/records?' + params.toString());
        document.getElementById('recTable').innerHTML = `
          <table>
            <thead><tr><th>Event</th><th>School ID</th><th>Participant</th><th>Reg Status</th><th>Attendance</th><th>QR v#</th><th>Actions</th></tr></thead>
            <tbody>
              ${rows.length === 0 ? '<tr><td colspan="7">No records found.</td></tr>' : rows.map(r => `
                <tr>
                  <td>${esc(r.event_title)}</td>
                  <td><code>${esc(r.school_id)}</code></td>
                  <td>${esc(r.full_name)}</td>
                  <td>${esc(r.registration_status)}</td>
                  <td><span class="badge ${r.attendance_status === 'PRESENT' ? 'badge-ok' : (r.attendance_status === 'ABSENT' ? 'badge-err' : 'badge-warn')}">${esc(r.attendance_status)}</span></td>
                  <td>v${r.token_version || 1}</td>
                  <td>
                    ${r.registration_status === 'REGISTERED' ? `<button class="btn btn-secondary btn-sm" onclick="reissueQr('${r.registration_id}')">Reissue QR</button>` : ''}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      };

      document.getElementById('btnFilterRec').addEventListener('click', load);
      window.reissueQr = async (regId) => {
        if (!confirm('Reissue QR code? The previous QR code will be invalidated immediately.')) return;
        try {
          const updated = await api('/api/registrations/' + regId + '/reissue', { method: 'POST' });
          flash(`QR reissued (v${updated.token_version}).`);
          load();
        } catch (err) {
          flash(err.message, 'err');
        }
      };
      await load();
    }

    async function renderReports() {
      const events = await api('/api/events?includeArchived=true');
      document.getElementById('adminContent').innerHTML = `
        <h1>Reports &amp; Exports</h1>
        <div class="card no-print">
          <div class="toolbar">
            <select id="repEvent" style="flex:1; min-width:240px;">
              <option value="">-- Select an Event for Detailed Export --</option>
              ${events.map(e => `<option value="${e.id}">${esc(e.title)} (${esc(e.event_date)} - ${esc(e.status)})</option>`).join('')}
            </select>
            <input id="repFrom" type="date" title="From Date">
            <input id="repTo" type="date" title="To Date">
            <button class="btn btn-primary" id="btnLoadSummary">Apply Filters</button>
            <button class="btn btn-secondary" onclick="window.print()">Print View</button>
          </div>
          <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            <button class="btn btn-secondary btn-sm" onclick="exportEvent('csv')">Export CSV</button>
            <button class="btn btn-secondary btn-sm" onclick="exportEvent('xlsx')">Export Excel (.xlsx)</button>
            <button class="btn btn-secondary btn-sm" onclick="exportEvent('pdf')">Export PDF</button>
          </div>
        </div>
        <div id="repSummaryArea">Loading...</div>
      `;

      window.exportEvent = (fmt) => {
        const id = document.getElementById('repEvent').value;
        if (!id) return flash('Please select an event first.', 'err');
        window.open(`/api/events/${id}/report?format=${fmt}`, '_blank');
      };

      const loadSummary = async () => {
        const params = new URLSearchParams();
        const from = document.getElementById('repFrom').value;
        const to = document.getElementById('repTo').value;
        if (from) params.set('fromDate', from);
        if (to) params.set('toDate', to);
        const s = await api('/api/reports/summary?' + params.toString());
        const t = s.totals;
        document.getElementById('repSummaryArea').innerHTML = `
          <div class="grid">
            <div class="card"><div class="stat-num">${t.totalEvents}</div><div class="stat-label">Events</div></div>
            <div class="card"><div class="stat-num">${t.totalRegistered}</div><div class="stat-label">Registered</div></div>
            <div class="card"><div class="stat-num">${t.totalPresent}</div><div class="stat-label">Present</div></div>
            <div class="card"><div class="stat-num">${t.overallAttendanceRate}%</div><div class="stat-label">Attendance Rate</div></div>
          </div>
          <div class="card" style="overflow-x:auto;">
            <h2 style="margin-top:0; font-size:1.05rem;">Event Summary Breakdown</h2>
            <table>
              <thead><tr><th>Event</th><th>Date</th><th>Status</th><th>Capacity</th><th>Registered</th><th>Present</th><th>Absent</th><th>Rate</th></tr></thead>
              <tbody>
                ${s.events.map(ev => `
                  <tr>
                    <td><strong>${esc(ev.title)}</strong></td>
                    <td>${esc(ev.event_date)}</td>
                    <td>${esc(ev.status)}</td>
                    <td>${ev.capacity}</td>
                    <td>${ev.registered}</td>
                    <td>${ev.present}</td>
                    <td>${ev.absent}</td>
                    <td>${ev.attendanceRate}%</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      };

      document.getElementById('btnLoadSummary').addEventListener('click', loadSummary);
      await loadSummary();
    }

    async function renderActivity() {
      document.getElementById('adminContent').innerHTML = `
        <h1>Activity Logs</h1>
        <div class="toolbar">
          <input id="actSearch" placeholder="Search logs..." style="flex:1; min-width:200px;">
          <button class="btn btn-primary" id="btnActFilter">Filter</button>
        </div>
        <div class="card" style="overflow-x:auto;"><div id="actTable">Loading...</div></div>
      `;
      const load = async () => {
        const q = document.getElementById('actSearch').value.trim();
        const logs = await api('/api/admin/activity' + (q ? '?search=' + encodeURIComponent(q) : ''));
        document.getElementById('actTable').innerHTML = `
          <table>
            <thead><tr><th>Timestamp</th><th>Action</th><th>User</th><th>Role</th><th>Description</th></tr></thead>
            <tbody>
              ${logs.map(l => `
                <tr>
                  <td>${esc(l.created_at)}</td>
                  <td><span class="badge badge-info">${esc(l.action)}</span></td>
                  <td>${esc(l.username || 'System')}</td>
                  <td>${esc(l.role || '-')}</td>
                  <td>${esc(l.description)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      };
      document.getElementById('btnActFilter').addEventListener('click', load);
      await load();
    }

    async function route() {
      const path = window.location.pathname.replace(/\/+$/, '') || '/admin';
      highlightNav(path);
      if (path === '/admin/participants') return renderParticipants();
      if (path === '/admin/accounts') return renderAccounts();
      if (path === '/admin/records') return renderRecords();
      if (path === '/admin/reports') return renderReports();
      if (path === '/admin/activity') return renderActivity();
      return renderDashboard();
    }

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    });

    (async () => {
      try {
        const me = await api('/api/auth/me');
        currentUser = me.user;
        if (currentUser.role !== 'administrator') {
          window.location.replace('/app');
          return;
        }
        document.getElementById('userLabel').textContent = currentUser.full_name;
        await route();
      } catch (e) {
        console.error(e);
      }
    })();
  </script>
</body>
</html>
